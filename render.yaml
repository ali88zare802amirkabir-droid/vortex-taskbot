services:
  # نکته: رندر فقط «یک دیتابیس رایگان» در هر ورکاسپیس اجازه می‌دهد.
  # TaskBot از DATABASE_URL شما استفاده می‌کند و همه‌چیز را داخل اسکیمای
  # مجزای `taskbot` می‌سازد؛ پس دیتای بقیه اپ‌ها دست نمی‌خورد.
  - type: web
    name: vortex-taskbot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        value: YourPostgresInternalConnectionString
      - key: PORT
        value: "3000"