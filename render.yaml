databases:
  - name: vortex-taskbot-db
    plan: free
    databaseName: vortex_taskbot
    user: vortex

services:
  - type: web
    name: vortex-taskbot
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    healthCheckPath: /
    envVars:
      - key: NODE_ENV
        value: production
      - key: TRUST_PROXY
        value: "1"
      - key: DATABASE_URL
        fromDatabase:
          name: vortex-taskbot-db
          property: connectionString